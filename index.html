@media(max-width:1000px){.command{grid-template-columns:1fr}}

<body><div id="root"></div>
<script>
const KEY='stocksense_v2';
const locations=[{id:'MAIN',name:'Main Warehouse',type:'Warehouse'},{id:'PROD',name:'Production Floor',type:'Location'},{id:'RACKA',name:'Rack A',type:'Location'},{id:'RACKB',name:'Rack B',type:'Location'},{id:'SEC',name:'Secondary Warehouse',type:'Warehouse'}];
const seed={user:{name:'Inventory Manager',email:'manager@stocksense.local',loggedIn:false},products:[
{id:1,name:'Steel Rods',sku:'SR-001',category:'Raw Material',unit:'kg',reorder:20,stocks:{MAIN:100,PROD:0,RACKA:0,RACKB:0,SEC:0}},
{id:2,name:'Office Chairs',sku:'CH-001',category:'Furniture',unit:'pcs',reorder:10,stocks:{MAIN:45,PROD:0,RACKA:0,RACKB:0,SEC:0}},
{id:3,name:'Printer Paper',sku:'PP-001',category:'Office',unit:'pcs',reorder:10,stocks:{MAIN:8,PROD:0,RACKA:0,RACKB:0,SEC:0}}
],warehouses:['Main Warehouse','Secondary Warehouse'],receipts:[],deliveries:[],transfers:[],adjustments:[],ledger:[{id:1,date:'2026-09-26 09:05',product:'Steel Rods',type:'Receipt',qty:'+100 kg',from:'Vendor',to:'Main Warehouse',ref:'RCPT-0001'}],categories:['Raw Material','Furniture','Office'],reorderRules:[{sku:'SR-001',min:20,max:100},{sku:'CH-001',min:10,max:50},{sku:'PP-001',min:10,max:50}]};
let db=JSON.parse(localStorage.getItem(KEY)||JSON.stringify(seed));
function normalizeDb(){
  db.user=db.user||{name:'Inventory Manager',email:'manager@stocksense.local',password:'password123',loggedIn:false};db.user.password=db.user.password||'password123';
  db.products=Array.isArray(db.products)?db.products:[]; db.receipts=Array.isArray(db.receipts)?db.receipts:[]; db.deliveries=Array.isArray(db.deliveries)?db.deliveries:[]; db.transfers=Array.isArray(db.transfers)?db.transfers:[]; db.adjustments=Array.isArray(db.adjustments)?db.adjustments:[]; db.ledger=Array.isArray(db.ledger)?db.ledger:[]; db.categories=Array.isArray(db.categories)?db.categories:[]; db.reorderRules=Array.isArray(db.reorderRules)?db.reorderRules:[];
  db.products.forEach(p=>{p.stocks=p.stocks||{};locations.forEach(l=>{let v=Number(p.stocks[l.id]);p.stocks[l.id]=Number.isFinite(v)&&v>=0?v:0});p.status=p.status||'Active';p.reorder=Math.max(0,Number(p.reorder)||0);p.unit=p.unit||'pcs';p.primaryLocation=p.primaryLocation&&locations.some(l=>l.id===p.primaryLocation)?p.primaryLocation:Object.keys(p.stocks).find(k=>(p.stocks[k]||0)>0)||'MAIN';p.primaryWarehouse=p.primaryWarehouse&&locations.some(l=>l.id===p.primaryWarehouse&&l.type==='Warehouse')?p.primaryWarehouse:(p.primaryLocation==='SEC'?'SEC':'MAIN');if(!db.categories.includes(p.category))db.categories.push(p.category)});
  db.reorderRules=db.products.map(p=>{let r=db.reorderRules.find(x=>x.sku===p.sku);return r||{sku:p.sku,min:p.reorder,max:p.reorder*5}});
  save();
}
normalizeDb();
let page='Dashboard',query='',filters={type:'All',status:'All',location:'All',category:'All'};
const nav=[['Dashboard','⌂'],['Products','▦'],['Receipts','↓'],['Deliveries','↑'],['Transfers','⇄'],['Adjustments','◌'],['Move History','☷'],['Settings','⚙']];
function save(){localStorage.setItem(KEY,JSON.stringify(db))}function toast(m){let x=document.createElement('div');x.className='toast';x.textContent=m;document.body.appendChild(x);setTimeout(()=>x.remove(),2200)}function go(p){page=p;query='';render()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function totalStock(p){return Object.values(p.stocks||{}).reduce((a,b)=>a+(Number(b)||0),0)}function lowItems(){return db.products.filter(p=>p.status!=='Archived'&&totalStock(p)<=p.reorder)}function locationName(id){return locations.find(x=>x.id===id)?.name||id}function statusPill(s){let c=s==='Done'?'':' '+(s==='Waiting'||s==='Ready'?'wait':s==='Canceled'?'low':'dark');return `<span class="pill${c}">${esc(s)}</span>`}
function filteredProducts(){let q=query.toLowerCase();return db.products.filter(p=>(!q||`${p.name} ${p.sku} ${p.category}`.toLowerCase().includes(q))&&(filters.category==='All'||p.category===filters.category)&&(filters.location==='All'||(p.stocks[filters.location]||0)>0))}
function render(){if(!db.user.loggedIn){auth();return}document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo"><div class="mark">S</div>Stock<span>Sense</span></div><div class="nav-title">Inventory</div><div class="nav">${nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span style="width:18px;text-align:center">${n[1]}</span>${n[0]}</button>`).join('')}</div><div class="side-bottom"><div class="nav"><button onclick="go('Profile')">◉ My Profile</button><button onclick="logout()">↪ Logout</button><button onclick="resetDemo()">↻ Reset demo data</button></div></div></aside><main class="main"><div class="topbar"><div><div class="eyebrow">StockSense / ${esc(page)}</div><h1 class="title">${esc(page)}</h1></div><div class="top-actions"><input class="search" placeholder="Search products or SKU…" value="${esc(query)}" oninput="query=this.value;render()"><div class="profile" onclick="go('Profile')"><div class="avatar">IM</div><div><b style="font-size:10px">${esc(db.user.name)}</b><div class="eyebrow" style="font-size:8px;margin:1px 0 0">Inventory Manager</div></div></div></div></div>${view()}</main></div>`}
function auth(mode='login'){document.getElementById('root').innerHTML=`<div class="login"><div class="auth"><div class="brand"><div class="mark">S</div>StockSense</div><h1>${mode==='signup'?'Create account':mode==='reset'?'Reset password':'Welcome back'}</h1><p>${mode==='signup'?'Set up your inventory manager account.':mode==='reset'?'OTP-based password reset for secure access.':'Sign in to your centralized inventory dashboard.'}</p>${mode==='signup'?`<div class=field><label>Full name</label><input id=aName value="Inventory Manager"></div>`:''}<div class=field><label>Email</label><input id=aEmail type=email value="${esc(db.user.email)}"></div>${mode!=='reset'?`<div class=field><label>Password</label><input id=aPass type=password value="password123"></div>`:''}${mode==='reset'?`<div class=field><label>OTP</label><input id=aOtp placeholder="Enter 6-digit OTP"></div><div class=otp-box>Demo OTP: <b id=demoOtp>${sessionStorage.demoOtp||'Click Send OTP'}</b></div><button class="btn secondary" onclick="sendOtp()">Send OTP</button><div class=field><label>New password</label><input id=aNew type=password value="password123"></div>`:''}<button class=btn onclick="${mode==='signup'?'signup()':mode==='reset'?'resetPassword()':'login()'}">${mode==='signup'?'Create account':mode==='reset'?'Reset password':'Login'}</button><div class=auth-foot>${mode==='login'?`New user? <button class=link onclick="auth('signup')">Sign up</button> · <button class=link onclick="auth('reset')">Forgot password?</button>`:`<button class=link onclick="auth('login')">Back to login</button>`}</div></div></div>`}
function login(){let e=document.getElementById('aEmail').value.trim(),pass=document.getElementById('aPass').value;if(!e||!pass)return alert('Enter email and password');if(e.toLowerCase()!==String(db.user.email).toLowerCase()||pass!==db.user.password)return alert('Invalid email or password');db.user.loggedIn=true;save();render()}function signup(){let name=document.getElementById('aName').value.trim(),e=document.getElementById('aEmail').value.trim(),pass=document.getElementById('aPass').value;if(!name||!e||!pass)return alert('Complete all account fields');if(!/^\S+@\S+\.\S+$/.test(e))return alert('Enter a valid email');db.user.name=name;db.user.email=e;db.user.password=pass;db.user.loggedIn=true;save();toast('Account created');render()}function sendOtp(){let e=document.getElementById('aEmail').value.trim();if(!e)return alert('Enter your email first');let otp=String(Math.floor(100000+Math.random()*900000));sessionStorage.demoOtp=otp;sessionStorage.demoOtpEmail=e.toLowerCase();document.getElementById('demoOtp').textContent=otp;toast('Demo OTP generated')}function resetPassword(){let otp=document.getElementById('aOtp').value.trim(),e=document.getElementById('aEmail').value.trim(),pass=document.getElementById('aNew').value;if(otp!==sessionStorage.demoOtp||e.toLowerCase()!==sessionStorage.demoOtpEmail)return alert('Invalid OTP or email');if(!pass||pass.length<6)return alert('New password must be at least 6 characters');db.user.email=e;db.user.password=pass;delete sessionStorage.demoOtp;delete sessionStorage.demoOtpEmail;save();toast('Password reset successfully');auth('login')}function logout(){db.user.loggedIn=false;save();auth('login')}
function dashboard(){let low=lowItems(),pendingR=db.receipts.filter(x=>x.status!=='Done'&&x.status!=='Canceled').length,pendingD=db.deliveries.filter(x=>x.status!=='Done'&&x.status!=='Canceled').length,pendingT=db.transfers.filter(x=>x.status!=='Done'&&x.status!=='Canceled').length;return `<div class=kpis>${kpi('Total Products in Stock',db.products.length,'SKUs','▦')}${kpi('Low / Out of Stock',low.length,low.length?'Needs attention':'All healthy','⚠')}${kpi('Pending Receipts',pendingR,'Open receipts','↓')}${kpi('Pending Deliveries',pendingD,'Open deliveries','↑')}${kpi('Internal Transfers Scheduled',pendingT,'Open transfers','⇄')}</div><div class="command"><div class="card signal"><div class="signal-top"><span class="live"><i></i> System live · real-time inventory</span><span class="pill info">AI-ready</span></div><h2>Inventory Command Center</h2><p>Operational visibility across warehouses, production locations and stock movements.</p><div class="metric-row"><div><b>${totalAll()}</b><span>units tracked</span></div><div><b>${locations.length}</b><span>locations</span></div><div><b>${db.ledger.length}</b><span>movements</span></div></div><div class="spark">${[42,58,48,70,61,84,73,92,78,96,88,100].map(h=>`<i style="height:${h}%"></i>`).join('')}</div></div><div class="card radar"><h3>Warehouse activity</h3><div class="sub">Live movement monitor</div><div class="radar-grid"><i class="radar-dot"></i><i class="radar-dot"></i><i class="radar-dot"></i></div></div></div><div class=grid><div class=card><div class=head><div><h3>Inventory overview</h3><div class=sub>Live availability by product and location</div></div><button class="btn secondary" onclick="go('Products')">Manage products</button></div>${filterBar()}<div class=table-wrap><table class=table><tr><th>Product</th><th>Category</th><th>Total</th><th>Location stock</th><th>Status</th></tr>${filteredProducts().slice(0,8).map(productRow).join('')}</table></div></div><div class=card><div class=head><div><h3>Stock health</h3><div class=sub>Low-stock alerts</div></div></div>${low.length?low.map(p=>`<div class=alert>⚠ <b>${esc(p.name)}</b> is at ${totalStock(p)} ${esc(p.unit)}; reorder point ${p.reorder}.</div>`).join(''):'<div class=empty>No stock alerts.</div>'}<div class=activity>${db.ledger.slice(-5).reverse().map(l=>`<div class=act><div class=dot></div><div><b>${esc(l.type)} · ${esc(l.product)}</b><p>${esc(l.qty)} · ${esc(l.from)} → ${esc(l.to)}</p></div></div>`).join('')}</div></div></div><div class=grid3><div class="card hero"><div class="muted" style="font-size:10px">Total inventory quantity</div><div class=hero-number>${totalAll()}</div><div class=muted style="font-size:10px">across all tracked locations</div><div class=mini><div><small>Products</small><b>${db.products.length}</b></div><div><small>Locations</small><b>${locations.length}</b></div></div></div><div class=card><div class=head><div><h3>Quick actions</h3><div class=sub>Start an inventory operation</div></div></div><div style="padding:3px 17px 18px;display:flex;gap:7px;flex-wrap:wrap"><button class=btn onclick="openReceipt()">+ Receipt</button><button class="btn secondary" onclick="openDelivery()">+ Delivery</button><button class="btn secondary" onclick="openTransfer()">+ Transfer</button><button class="btn secondary" onclick="openAdjustment()">+ Adjustment</button></div></div><div class=card><div class=head><div><h3>Inventory flow</h3><div class=sub>Receive → move → deliver → adjust</div></div></div><div style="padding:8px 17px 18px;font-size:10px;line-height:2.2"><div>1. Receive goods → <b>stock increases</b></div><div>2. Internal transfer → <b>location changes</b></div><div>3. Delivery → <b>stock decreases</b></div><div>4. Adjustment → <b>difference is logged</b></div></div></div></div>`}
function totalAll(){return db.products.reduce((s,p)=>s+totalStock(p),0)}function kpi(a,b,c,i){return `<div class="card kpi"><div class=kpi-head><span class=kpi-label>${a}</span><span class=kpi-icon>${i}</span></div><div class=kpi-value>${b}</div><div class=kpi-sub>${c}</div></div>`}
function filterBar(){return `<div class=filters><select onchange="filters.type=this.value;render()"><option>All</option><option>Receipts</option><option>Delivery</option><option>Internal</option><option>Adjustments</option></select><select onchange="filters.status=this.value;render()"><option>All</option><option>Draft</option><option>Waiting</option><option>Ready</option><option>Done</option><option>Canceled</option></select><select onchange="filters.location=this.value;render()"><option value="All">All locations</option>${locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select><select onchange="filters.category=this.value;render()"><option>All</option>${db.categories.map(c=>`<option>${c}</option>`).join('')}</select></div>`}
function productRow(p){let locs=locations.map(l=>`${l.name}: ${p.stocks[l.id]||0} ${p.unit}`).filter((x,i)=>(p.stocks[locations[i].id]||0)>0).join(' · ')||`${locationName(p.primaryLocation||'MAIN')}: 0 ${p.unit}`;return `<tr><td><div class=name>${esc(p.name)}</div><div class=sku>${esc(p.sku)}</div></td><td>${esc(p.category)}</td><td><b>${totalStock(p)} ${esc(p.unit)}</b></td><td>${esc(locs)}</td><td>${totalStock(p)<=p.reorder?'<span class="pill low">Low / Out</span>':'<span class=pill>Healthy</span>'}</td></tr>`}
function products(){return `<div class=toolbar><input class=grow placeholder="Search name, SKU or category" value="${esc(query)}" oninput="query=this.value;render()"><select onchange="filters.category=this.value;render()"><option>All</option>${db.categories.map(c=>`<option ${filters.category===c?'selected':''}>${c}</option>`).join('')}</select><button class=btn onclick="openProduct()">+ Create product</button></div><div class=card><div class=head><div><h3>Product catalog</h3><div class=sub>Create/update products, availability by location and reordering rules.</div></div></div><div class=table-wrap><table class=table><tr><th>Product</th><th>Category</th><th>UoM</th><th>Total stock</th><th>Locations</th><th>Reorder</th><th>Action</th></tr>${filteredProducts().map(p=>`<tr><td><div class=name>${esc(p.name)}</div><div class=sku>${esc(p.sku)}</div></td><td>${esc(p.category)}</td><td>${esc(p.unit)}</td><td><b>${totalStock(p)}</b></td><td>${locations.filter(l=>(p.stocks[l.id]||0)>0).map(l=>`${l.name}: ${p.stocks[l.id]} ${p.unit}`).join('<br>')||`${locationName(p.primaryLocation||'MAIN')}: 0 ${p.unit}`}</td><td>${p.reorder}</td><td><button class="btn secondary" onclick="openProduct(${p.id})">Edit</button></td></tr>`).join('')}</table></div></div>`}
function operations(title,sub,rows,cols,addFn,addLabel){return `<div class=toolbar><div class=grow><span class=sub>${sub}</span></div><button class=btn onclick="${addFn}">${addLabel}</button></div><div class=card><div class=table-wrap><table class=table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${r[c]??'—'}</td>`).join('')}</tr>`).join(''):`<tr><td colspan=${cols.length} class=empty>No records yet.</td></tr>`}</table></div></div>`}
function receipts(){let rows=db.receipts.filter(r=>matchesOp(r,'Receipts')).map(r=>({Reference:r.ref,Supplier:r.supplier,Product:r.product,Quantity:r.quantity,Status:statusPill(r.status),Created:r.date}));return operations('Receipts','Incoming goods from vendors. Validate to increase stock.',rows,['Reference','Supplier','Product','Quantity','Status','Created'],'openReceipt()','+ New receipt')}
function deliveries(){let rows=db.deliveries.filter(r=>matchesOp(r,'Delivery')).map(r=>({Reference:r.ref,Customer:r.customer,Product:r.product,Quantity:r.quantity,Status:statusPill(r.status),Created:r.date}));return operations('Delivery Orders','Pick → Pack → Validate. Validation decreases stock.',rows,['Reference','Customer','Product','Quantity','Status','Created'],'openDelivery()','+ New delivery')}
function transfers(){let rows=db.transfers.filter(r=>matchesOp(r,'Internal')).map(r=>({Reference:r.ref,Product:r.product,Quantity:r.quantity,From:r.from,To:r.to,Status:statusPill(r.status)}));return operations('Internal Transfers','Move stock between company locations; total company stock stays unchanged.',rows,['Reference','Product','Quantity','From','To','Status'],'openTransfer()','+ New transfer')}
function adjustments(){let rows=db.adjustments.filter(r=>matchesOp(r,'Adjustments')).map(r=>({Reference:r.ref,Product:r.product,Location:r.location,System:r.system,Physical:r.physical,Difference:r.diff,Status:statusPill('Done')}));return operations('Inventory Adjustments','Compare recorded stock with physical count and auto-update.',rows,['Reference','Product','Location','System','Physical','Difference','Status'],'openAdjustment()','+ New adjustment')}
function matchesOp(r,type){return (filters.type==='All'||filters.type===type)&&(filters.status==='All'||r.status===filters.status)&&(filters.location==='All'||r.locationId===filters.location)&&(filters.category==='All'||r.category===filters.category)}
function moveHistory(){return `<div class=card><div class=head><div><h3>Stock Ledger / Move History</h3><div class=sub>Every receipt, delivery, internal transfer and adjustment is logged.</div></div></div><div class=filters><select onchange="filters.type=this.value;render()"><option>All</option><option>Receipts</option><option>Delivery</option><option>Internal</option><option>Adjustments</option></select><input placeholder="Filter SKU/product" oninput="query=this.value;render()"></div><div class=table-wrap><table class=table><tr><th>Date</th><th>Reference</th><th>Product</th><th>Type</th><th>Qty</th><th>From</th><th>To</th></tr>${db.ledger.slice().reverse().filter(l=>!query||`${l.product} ${l.sku||''}`.toLowerCase().includes(query.toLowerCase())).map(l=>`<tr><td>${esc(l.date)}</td><td>${esc(l.ref)}</td><td><b>${esc(l.product)}</b></td><td>${statusPill(l.type)}</td><td><b>${esc(l.qty)}</b></td><td>${esc(l.from)}</td><td>${esc(l.to)}</td></tr>`).join('')}</table></div></div>`}
function settings(){return `<div class=grid><div class=card><div class=head><div><h3>Warehouse / Location</h3><div class=sub>Multi-warehouse and internal locations</div></div><button class=btn onclick="addLocation()">+ Add location</button></div><div class=table-wrap><table class=table><tr><th>Name</th><th>Type</th><th>Status</th></tr>${locations.map(l=>`<tr><td>${l.name}</td><td>${l.type}</td><td><span class=pill>Active</span></td></tr>`).join('')}</table></div></div><div class=card><div class=head><div><h3>Reordering Rules</h3><div class=sub>Minimum quantity used by low-stock alerts</div></div><button class="btn secondary" onclick="openReorder()">Manage</button></div><div class=table-wrap><table class=table><tr><th>SKU</th><th>Minimum</th><th>Maximum</th></tr>${db.reorderRules.map(r=>`<tr><td>${r.sku}</td><td>${r.min}</td><td>${r.max}</td></tr>`).join('')}</table></div></div></div>`}
function profile(){return `<div class=card profile-panel><div class=profile-card><div class=big-avatar>IM</div><div><h3 style="margin:0 0 4px">${esc(db.user.name)}</h3><div class=sub>${esc(db.user.email)}</div><span class=pill style="margin-top:8px">Inventory Manager</span></div></div><div class=form><div class=field><label>Full name</label><input id=pName value="${esc(db.user.name)}"></div><div class=field><label>Email</label><input id=pEmail value="${esc(db.user.email)}"></div><div class=full><button class=btn onclick="saveProfile()">Save profile</button></div></div></div>`}
function view(){if(page==='Dashboard')return dashboard();if(page==='Products')return products();if(page==='Receipts')return receipts();if(page==='Deliveries')return deliveries();if(page==='Transfers')return transfers();if(page==='Adjustments')return adjustments();if(page==='Move History')return moveHistory();if(page==='Profile')return profile();return settings()}
function modal(title,body,saveFn,validateFn=null,validateLabel='Validate'){let x=document.createElement('div');x.className='modal-bg';let primary=validateFn?`<button class="btn secondary" type="button" onclick="${saveFn}(this.closest('.modal-bg'), 'Draft')">Save Draft</button><button class=btn type="button" onclick="${validateFn}(this.closest('.modal-bg'))">✓ ${validateLabel}</button>`:`<button class=btn type="button" onclick="${saveFn}(this.closest('.modal-bg'))">${title.includes('Adjustment')?'Apply Adjustment':'Save'}</button>`;x.innerHTML=`<div class=modal><h2>${title}</h2>${body}<div class=actions><button class="btn secondary" type="button" onclick="this.closest('.modal-bg').remove()">Cancel</button>${primary}</div></div>`;document.body.appendChild(x);x.querySelectorAll('input,select').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();let btn=x.querySelector('.actions .btn:last-child');if(btn)btn.click()}}))}
function productForm(p={name:'',sku:'',category:'Raw Material',unit:'pcs',reorder:10}){let current=p.id?totalStock(p):0;let activeLoc=p.id&&p.primaryLocation&&locations.some(l=>l.id===p.primaryLocation)?p.primaryLocation:'MAIN';let warehouse=p.id&&p.primaryWarehouse&&locations.some(l=>l.id===p.primaryWarehouse&&l.type==='Warehouse')?p.primaryWarehouse:(activeLoc==='SEC'?'SEC':'MAIN');return `<div class=form><input type=hidden id=fOriginalSku value="${esc(p.sku||'')}"><div class=full><div class=section-label>Product information</div></div><div class=field><label>Product name</label><input id=fName value="${esc(p.name)}" autocomplete=off></div><div class=field><label>SKU / Code</label><input id=fSku value="${esc(p.sku)}" autocomplete=off></div><div class=field><label>Category</label><select id=fCat>${db.categories.map(c=>`<option ${p.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class=field><label>Unit of Measure</label><input id=fUnit value="${esc(p.unit)}"></div><div class=full><div class=section-label>Inventory configuration</div></div><div class=field><label>Reorder minimum</label><input id=fReorder type=number min=0 step=1 value="${Number(p.reorder)||0}"></div><div class=field><label>Current stock</label><div class=readonly-stock><strong>${current}</strong> ${esc(p.unit||'pcs')} ${current===0?'<span class=stock-out>OUT OF STOCK</span>':current<=Number(p.reorder||0)?'<span class=stock-low>LOW STOCK</span>':'<span class=stock-ok>HEALTHY</span>'}</div></div><div class=field><label>Primary warehouse</label><select id=fWarehouse>${locations.filter(l=>l.type==='Warehouse').map(l=>`<option value="${l.id}" ${warehouse===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class=field><label>Primary location</label><select id=fLocation>${locations.map(l=>`<option value="${l.id}" ${activeLoc===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select></div><div class=field><label>Status</label><select id=fStatus><option ${p.status!=='Archived'?'selected':''}>Active</option><option ${p.status==='Archived'?'selected':''}>Archived</option></select></div>${p.id?'':'<div class=field><label>Initial stock (optional)</label><input id=fInitial type=number min=0 step=1 value="0"></div>'}<div class=full><div class=stock-note>Stock quantity is changed through Receipts, Deliveries, Internal Transfers and Inventory Adjustments so every movement remains in the Stock Ledger.</div></div></div>`}
function openProduct(id){let p=db.products.find(x=>x.id===id)||null;modal(p?'Update product':'Create product',productForm(p||{}),p?'saveProductEdit':'saveProduct')}
function saveProduct(bg){let initial=Math.max(0,Number(document.getElementById('fInitial')?.value||0)),loc=document.getElementById('fLocation')?.value||'MAIN',warehouse=document.getElementById('fWarehouse')?.value||'MAIN',name=document.getElementById('fName').value.trim(),sku=document.getElementById('fSku').value.trim();if(!name||!sku)return alert('Name and SKU are required');if(db.products.some(x=>x.sku.toLowerCase()===sku.toLowerCase()))return alert('SKU already exists');let p={id:Date.now(),name,sku,category:document.getElementById('fCat').value,unit:document.getElementById('fUnit').value.trim()||'pcs',reorder:Math.max(0,Number(document.getElementById('fReorder').value)||0),status:document.getElementById('fStatus')?.value||'Active',primaryLocation:loc,primaryWarehouse:warehouse,stocks:{}};locations.forEach(l=>p.stocks[l.id]=0);p.stocks[loc]=initial;db.products.push(p);if(!db.categories.includes(p.category))db.categories.push(p.category);db.reorderRules.push({sku:p.sku,min:p.reorder,max:p.reorder*5});save();bg.remove();toast('Product created');render()}
function saveProductEdit(bg){let original=document.getElementById('fOriginalSku').value.trim(),name=document.getElementById('fName').value.trim(),sku=document.getElementById('fSku').value.trim(),target=db.products.find(x=>x.sku===original);if(!target)return alert('Product record not found');if(!name||!sku)return alert('Name and SKU are required');if(db.products.some(x=>x!==target&&x.sku.toLowerCase()===sku.toLowerCase()))return alert('Another product already uses this SKU');let oldSku=target.sku;target.name=name;target.sku=sku;target.category=document.getElementById('fCat').value;target.unit=document.getElementById('fUnit').value.trim()||'pcs';target.reorder=Math.max(0,Number(document.getElementById('fReorder').value)||0);target.status=document.getElementById('fStatus')?.value||'Active';target.primaryWarehouse=document.getElementById('fWarehouse')?.value||target.primaryWarehouse||'MAIN';target.primaryLocation=document.getElementById('fLocation')?.value||target.primaryLocation||'MAIN';let rr=db.reorderRules.find(x=>x.sku===oldSku);if(rr)rr.sku=sku,rr.min=target.reorder,rr.max=Math.max(rr.max||0,target.reorder*5);else db.reorderRules.push({sku,min:target.reorder,max:target.reorder*5});db.ledger.forEach(x=>{if(x.sku===oldSku)x.sku=sku;if(x.product===oldSku)x.product=name});db.receipts.forEach(x=>{if(x.sku===oldSku){x.sku=sku;x.product=name}});db.deliveries.forEach(x=>{if(x.sku===oldSku){x.sku=sku;x.product=name}});db.transfers.forEach(x=>{if(x.sku===oldSku){x.sku=sku;x.product=name}});db.adjustments.forEach(x=>{if(x.sku===oldSku){x.sku=sku;x.product=name}});if(!db.categories.includes(target.category))db.categories.push(target.category);save();bg.remove();toast('Product updated successfully');render()}
function opForm(kind){let ps=db.products.map(p=>`<option value="${p.id}">${p.name} (${p.sku})</option>`).join('');if(kind==='receipt')return `<div class=form><div class=field><label>Supplier</label><input id=oParty value="ABC Supplier"></div><div class=field><label>Product</label><select id=oProduct>${ps}</select></div><div class=field><label>Quantity</label><input id=oQty type=number value=50 min=1></div><div class=field><label>Destination</label><select id=oLoc>${locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div class=field><label>Status</label><select id=oStatus><option>Draft</option><option>Waiting</option><option>Ready</option><option>Done</option><option>Canceled</option></select></div></div>`;if(kind==='delivery')return `<div class=form><div class=field><label>Customer</label><input id=oParty value="XYZ Customer"></div><div class=field><label>Product</label><select id=oProduct>${ps}</select></div><div class=field><label>Source location</label><select id=oLoc>${locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div class=field><label>Quantity</label><input id=oQty type=number value=10 min=1></div><div class=field><label>Workflow status</label><select id=oStatus><option>Draft</option><option>Waiting</option><option>Ready</option><option>Done</option><option>Canceled</option></select></div><div class=full><div class=steps><span class="step done">1 Pick</span><span class=step>2 Pack</span><span class=step>3 Validate</span></div></div></div>`;if(kind==='transfer')return `<div class=form><div class=field><label>Product</label><select id=oProduct>${ps}</select></div><div class=field><label>Quantity</label><input id=oQty type=number value=10 min=1></div><div class=field><label>From</label><select id=oFrom>${locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div class=field><label>To</label><select id=oTo>${locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div class=field><label>Status</label><select id=oStatus><option>Draft</option><option>Waiting</option><option>Ready</option><option>Done</option><option>Canceled</option></select></div></div>`;return `<div class=form><div class=field><label>Product</label><select id=oProduct>${ps}</select></div><div class=field><label>Location</label><select id=oLoc>${locations.map(l=>`<option value="${l.id}">${l.name}</option>`).join('')}</select></div><div class=field><label>Physical count</label><input id=oPhysical type=number value=0 min=0></div></div>`}
function openReceipt(){modal('New Receipt',opForm('receipt'),'saveReceipt','validateReceipt','Validate Receipt')}function openDelivery(){modal('New Delivery Order',opForm('delivery'),'saveDelivery','validateDelivery','Validate Delivery')}function openTransfer(){modal('New Internal Transfer',opForm('transfer'),'saveTransfer','validateTransfer','Validate Transfer')}function openAdjustment(){modal('New Inventory Adjustment',opForm('adjust'),'saveAdjustment')}
function saveReceipt(bg,forcedStatus){let p=db.products.find(x=>x.id==document.getElementById('oProduct').value),q=Number(document.getElementById('oQty').value),loc=document.getElementById('oLoc').value,s=forcedStatus||document.getElementById('oStatus').value;if(!p||q<=0)return alert('Enter valid product and quantity');p.stocks[loc]=Number(p.stocks[loc])||0;let ref='RCPT-'+String(db.receipts.length+1).padStart(4,'0');if(s==='Done')p.stocks[loc]+=q;let r={ref,supplier:document.getElementById('oParty').value.trim()||'Unknown Supplier',product:p.name,sku:p.sku,category:p.category,quantity:q+' '+p.unit,status:s,date:new Date().toLocaleString(),locationId:loc};db.receipts.push(r);if(s==='Done')log(r.ref,p,'Receipt','+'+q+' '+p.unit,'Vendor',locationName(loc));save();bg.remove();toast(s==='Done'?'Receipt validated — stock increased':'Receipt saved as draft');render()}
function validateReceipt(bg){saveReceipt(bg,'Done')}
function saveDelivery(bg,forcedStatus){let p=db.products.find(x=>x.id==document.getElementById('oProduct').value),q=Number(document.getElementById('oQty').value),loc=document.getElementById('oLoc').value,s=forcedStatus||document.getElementById('oStatus').value;if(!p||q<=0)return alert('Enter valid product and quantity');p.stocks[loc]=Number(p.stocks[loc])||0;if(s==='Done'&&p.stocks[loc]<q)return alert('Insufficient stock at selected location');let ref='DO-'+String(db.deliveries.length+1).padStart(4,'0');if(s==='Done')p.stocks[loc]-=q;let r={ref,customer:document.getElementById('oParty').value.trim()||'Unknown Customer',product:p.name,sku:p.sku,category:p.category,quantity:q+' '+p.unit,status:s,date:new Date().toLocaleString(),locationId:loc};db.deliveries.push(r);if(s==='Done')log(r.ref,p,'Delivery','-'+q+' '+p.unit,locationName(loc),'Customer');save();bg.remove();toast(s==='Done'?'Delivery validated — stock decreased':'Delivery saved as draft');render()}
function validateDelivery(bg){saveDelivery(bg,'Done')}
function saveTransfer(bg,forcedStatus){let p=db.products.find(x=>x.id==document.getElementById('oProduct').value),q=Number(document.getElementById('oQty').value),from=document.getElementById('oFrom').value,to=document.getElementById('oTo').value,s=forcedStatus||document.getElementById('oStatus').value;if(!p||q<=0||from===to)return alert('Choose valid product, quantity and different locations');p.stocks[from]=Number(p.stocks[from])||0;p.stocks[to]=Number(p.stocks[to])||0;if(s==='Done'&&p.stocks[from]<q)return alert('Insufficient stock at source');let ref='TRF-'+String(db.transfers.length+1).padStart(4,'0');if(s==='Done'){p.stocks[from]-=q;p.stocks[to]+=q}let r={ref,product:p.name,sku:p.sku,category:p.category,quantity:q+' '+p.unit,from:locationName(from),to:locationName(to),status:s,date:new Date().toLocaleString(),locationId:from};db.transfers.push(r);if(s==='Done')log(r.ref,p,'Transfer',q+' '+p.unit,locationName(from),locationName(to));save();bg.remove();toast(s==='Done'?'Transfer validated — location updated':'Transfer saved as draft');render()}
function validateTransfer(bg){saveTransfer(bg,'Done')}
function saveAdjustment(bg){let p=db.products.find(x=>x.id==document.getElementById('oProduct').value),loc=document.getElementById('oLoc').value,physical=Number(document.getElementById('oPhysical').value);if(!p||physical<0)return alert('Enter a valid physical count');let old=p.stocks[loc]||0,diff=physical-old,ref='ADJ-'+String(db.adjustments.length+1).padStart(4,'0');p.stocks[loc]=physical;let r={ref,product:p.name,sku:p.sku,category:p.category,location:locationName(loc),locationId:loc,system:old,physical,diff:(diff>=0?'+':'')+diff+' '+p.unit,date:new Date().toLocaleString()};db.adjustments.push(r);log(ref,p,'Adjustment',(diff>=0?'+':'')+diff+' '+p.unit,locationName(loc),'—');save();bg.remove();toast('Physical count applied and logged');render()}
function log(ref,p,type,qty,from,to){db.ledger.push({id:Date.now(),date:new Date().toLocaleString(),ref,product:p.name,sku:p.sku,type,qty,from,to})}
function addLocation(){let n=prompt('Location name','New Rack');if(!n)return;locations.push({id:'L'+Date.now(),name:n,type:'Location'});db.products.forEach(p=>p.stocks[locations.at(-1).id]=0);toast('Location added');render()}
function openReorder(){modal('Reordering Rules',`<div class=field><label>Product</label><select id=rSku>${db.products.map(p=>`<option value="${p.sku}">${p.name} (${p.sku})</option>`).join('')}</select></div><div class=form><div class=field><label>Minimum quantity</label><input id=rMin type=number value=10></div><div class=field><label>Maximum quantity</label><input id=rMax type=number value=50></div></div>`,'saveReorder')}
function saveReorder(bg){let sku=document.getElementById('rSku').value,min=Number(document.getElementById('rMin').value),max=Number(document.getElementById('rMax').value),p=db.products.find(x=>x.sku===sku);if(!p||min<0||max<min)return alert('Invalid rule');p.reorder=min;let r=db.reorderRules.find(x=>x.sku===sku);if(r){r.min=min;r.max=max}else db.reorderRules.push({sku,min,max});save();bg.remove();toast('Reordering rule updated');render()}
function saveProfile(){db.user.name=document.getElementById('pName').value||'Inventory Manager';db.user.email=document.getElementById('pEmail').value;save();toast('Profile updated');render()}
function resetDemo(){if(confirm('Reset StockSense demo data?')){localStorage.removeItem(KEY);location.reload()}}
function saveAndRender(){save();render()}
render();
</script></body></html>
